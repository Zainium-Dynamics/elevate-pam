# elevate-pam -- PAM engine, builtin modules and CLI (Linux-PAM replacement)
#
# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "2"
members = [
    "pam",
    "libpam-abi",
    "libpam-misc",
    "elevate-pam-cli",
    "modules/pam-unix",
    "modules/pam-env",
    "modules/pam-limits",
    "modules/pam-deny",
    "modules/pam-permit",
    "modules/pam-rootok",
    "modules/pam-wheel",
    "modules/pam-nologin",
    "modules/pam-securetty",
    "modules/pam-access",
    "modules/pam-faillock",
    "modules/pam-mkhomedir",
    "modules/pam-pwhistory",
    "modules/pam-loginuid",
    "modules/pam-cap",
    "modules/pam-listfile",
    "modules/pam-timestamp",
    "modules/pam-keyinit",
    "modules/pam-group",
    "modules/pam-time",
    "modules/pam-xauth",
    "modules/pam-canonicalize-user",
    "modules/pam-filter",
    "modules/pam-ftp",
    "modules/pam-stress",
    "modules/pam-tally2",
    "modules/pam-namespace",
    "modules/pam-systemd",
    "helpers/unix_chkpwd",
]
default-members = [
    "pam",
    "libpam-abi",
    "libpam-misc",
    "elevate-pam-cli",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["alizain <alizain@zainiumdynamics.tech>"]
homepage = "https://zainiumdynamics.tech"
repository = "https://github.com/Zainium-Dynamics/elevate-privilege"
categories = ["authentication", "os::linux-apis"]
keywords = ["pam", "authentication", "linux", "security"]

[workspace.dependencies]
elevate-pam = { path = "pam", version = "1.0.1" }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
